services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: chatter
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatter"]
      interval: 5s
      retries: 5
  
  web:
    build: .
    env_file: .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  
volumes:
  pgdata: